<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Tradey Desk</title><style>body{font:15px system-ui;background:#0b1020;color:#e8eefc;margin:32px}h1{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:24px 0}.card{background:#151d34;border:1px solid #2b385d;border-radius:10px;padding:16px}.n{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2b385d;text-align:left}.muted{color:#9eaccb}</style><h1>Tradey Desk</h1><div class="muted">Paper-mode audit dashboard</div><div id="app"></div><script>fetch('dashboard.json').then(r=>r.json()).then(d=>{let p=d.performance,v=d.reviews;document.querySelector('#app').innerHTML=`<div class=grid><div class=card><div>Excess vs SPY (5 sessions)</div><div class=n>${p.avg_excess_5s_pct??'—'}%</div></div><div class=card><div>Dual-model reviews</div><div class=n>${v.total_dual_model_reviews}</div></div><div class=card><div>Agreements</div><div class=n>${v.agreements}</div></div><div class=card><div>Disagreements</div><div class=n>${v.disagreements}</div></div><div class=card><div>Unavailable</div><div class=n>${v.unavailable}</div></div></div><h2>Decision audit</h2><pre>${JSON.stringify(d.decision_audit,null,2)}</pre><h2>Blocked disagreements</h2><pre>${JSON.stringify(d.blocked_disagreements,null,2)}</pre><h2>Recent sanitized ledger</h2><pre>${JSON.stringify(d.recent_orders,null,2)}</pre>`})</script>
